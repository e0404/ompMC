[build-system]
requires = ["scikit-build-core >=0.10", "nanobind >=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "ompmc"
description = "OpenMP parallel Monte Carlo photon and electron transport in voxel geometries"
readme = "README.md"
# 3.10 because nanobind 3.0 dropped 3.9, which reached end of life in
# October 2025. Nothing in ompMC needs anything newer than 3.9 itself.
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Edgardo Doerner", email = "endoerner@gmail.com" },
    { name = "Niklas Wahl", email = "n.wahl@dkfz-heidelberg.de" },
]
maintainers = [
    { name = "Niklas Wahl", email = "n.wahl@dkfz-heidelberg.de" },
]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: C",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = ["numpy >=1.22", "scipy >=1.8"]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/e0404/ompMC"

[project.optional-dependencies]
test = ["pytest >=7"]
# Listed for reference; the docs build itself uses docs/requirements.txt so
# that building the site never needs the compiled extension -- see the
# comment in docs/conf.py.
docs = [
    "sphinx >=7",
    "furo",
    "myst-parser",
    "breathe",
    "sphinxcontrib-matlabdomain",
    "sphinx-copybutton",
    "sphinx-design",
]

[tool.scikit-build]
# 3.26 is where FindPython grew the Development.SABIModule component that the
# limited API build below needs. The C user codes still build with 3.20.
cmake.version = ">=3.26"
wheel.packages = ["ucodes/omc_python/ompmc"]
sdist.exclude = ["build/", "build-*/", "output/", "phantoms/", ".github/"]

# Build against CPython's stable ABI, which nanobind supports from 3.12 on, so
# that one wheel per platform serves 3.12 and every later Python. On 3.10 and
# 3.11 scikit-build-core ignores this and emits a version specific wheel; see
# the SKBUILD_SABI_COMPONENT comment in CMakeLists.txt.
wheel.py-api = "cp312"

[tool.scikit-build.cmake.define]
OMPMC_BUILD_PYTHON = "ON"
OMPMC_BUILD_DOSXYZ = "OFF"
OMPMC_BUILD_DOSRZ = "OFF"
OMPMC_BUILD_MATRAD_MEX = "OFF"
OMPMC_BUILD_MATRAD_OCT = "OFF"
OMPMC_BUILD_TESTS = "OFF"

# The version lives in the CMake project() call, the single source of truth the
# C code's OMPMC_VERSION_STRING also comes from.
[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.regex"
field = "version"
input = "CMakeLists.txt"
regex = 'project\(ompMC\s+VERSION (?P<value>[0-9]+\.[0-9]+\.[0-9]+)'

[tool.pytest.ini_options]
testpaths = ["ucodes/omc_python/tests"]
markers = [
    "mex: compares against a stored result of the MATLAB MEX interface",
]

################################################################################
# Wheel building. Run it locally with 'pipx run cibuildwheel --platform <os>';
# .github/workflows/wheels.yml runs the same configuration on CI.
################################################################################

[tool.cibuildwheel]
# cp312 yields one abi3 wheel that serves 3.12 and everything after it, so the
# only per version builds left are 3.10 and 3.11. PyPy is out because nanobind
# targets CPython, and musllinux because nothing here needs an Alpine build.
build = ["cp310-*", "cp311-*", "cp312-*"]
# Windows "auto" archs still include 32 bit, which is not a machine anyone
# runs a Monte Carlo dose calculation on.
skip = ["*-musllinux_*", "*-win32"]

# scipy arrives as a runtime dependency, which is what the fixtures need to
# read the matRad .mat file, so pytest is the only addition.
#
# The MEX cross-check is deselected here: its stored reference comes from one
# MEX build on one machine, and holding four other toolchains to that build's
# exact sparsity pattern would be testing libm, not ompMC. It stays a local
# test -- see its docstring.
#
# -s, because the engine writes through C stdio: without it pytest redirects
# the file descriptors and a process that dies rather than fails a test takes
# its own diagnosis with it -- an abort message, an OpenMP runtime error and
# pytest's own faulthandler traceback all go to the real stderr or nowhere.
test-requires = ["pytest"]
test-command = 'pytest {package}/ucodes/omc_python/tests -m "not mex" -s'

[tool.cibuildwheel.macos]
# Apple's clang carries no OpenMP runtime. CMakeLists.txt asks brew --prefix
# for this one on its own (see the OpenMP section there), and delocate then
# copies libomp.dylib into the wheel.
before-all = "brew install libomp"

[tool.cibuildwheel.windows]
# MSVC's /openmp links vcomp140.dll, which is not a part of Windows -- it
# arrives with the Visual C++ redistributable. Vendor it instead of assuming
# it is installed, the way scikit-learn does. Everything else about the repair
# step is cibuildwheel's default.
repair-wheel-command = "delvewheel repair --add-dll vcomp140.dll -w {dest_dir} -v {wheel}"
